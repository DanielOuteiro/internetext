[build]
  publish = "public"
  command = "true"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/pages"
  to = "/.netlify/functions/pages"
  status = 200
  force = true

[[redirects]]
  from = "/api/page/:num"
  to = "/.netlify/functions/page?num=:num"
  status = 200
  force = true
