<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>INTERNETEXT</title>
  <link rel="preload" href="/fonts/bedstead.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="tv">
      <canvas id="screen" aria-label="Teletext screen" role="img"></canvas>
      <div class="crt" aria-hidden="true"></div>
    </div>
    <nav class="remote" aria-label="Remote control">
      <div class="digits">
        <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
        <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
        <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
        <button data-d="0">0</button>
      </div>
      <div class="nav">
        <button data-a="prev" title="Previous page (Left)">P-</button>
        <button data-a="next" title="Next page (Right)">P+</button>
        <button data-a="subPrev" title="Previous subpage (Up)">S-</button>
        <button data-a="subNext" title="Next subpage (Down)">S+</button>
        <button data-a="hold" title="Hold subpage (H)">HOLD</button>
        <button data-a="index" title="Index (I)">100</button>
      </div>
      <div class="fast">
        <button class="red" data-f="0" title="R"></button>
        <button class="green" data-f="1" title="G"></button>
        <button class="yellow" data-f="2" title="Y"></button>
        <button class="cyan" data-f="3" title="C"></button>
      </div>
    </nav>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
